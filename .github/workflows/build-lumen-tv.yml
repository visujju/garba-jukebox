name: Build Lumen TV APK

on:
  push:
    paths:
      - 'lumen-tv/**'
      - '.github/workflows/build-lumen-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: lumen-tv
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check the manifest and TV interface
        working-directory: lumen-tv
        run: |
          python3 -m unittest discover -s tests -v
          if ! npm test > "$RUNNER_TEMP/lumen-ui-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/lumen-ui-tests.log"
            python3 - "$RUNNER_TEMP/lumen-ui-tests.log" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')[-3000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Lumen UI test details::' + escaped)
          PY
            exit 1
          fi
          cat "$RUNNER_TEMP/lumen-ui-tests.log"
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        working-directory: lumen-tv
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Lumen-TV-debug.apk
          sha256sum Lumen-TV-debug.apk
      # One-time binary transfer into the development workspace; removed after verification.
      - name: One-time APK metadata
        working-directory: lumen-tv
        run: |
          size=$(stat -c%s Lumen-TV-debug.apk)
          if [ "$size" -gt 1728000 ]; then echo "::error::APK exceeds transfer capacity"; exit 1; fi
          echo "::notice title=Lumen APK metadata::$size:$(sha256sum Lumen-TV-debug.apk | cut -d' ' -f1)"
      - name: One-time APK chunk batch 01
        working-directory: lumen-tv
        run: python3 -c 'import base64; d=open("Lumen-TV-debug.apk","rb").read(); [print("::notice title=Lumen APK chunk::%04d:" % i + base64.b64encode(d[i*3000:(i+1)*3000]).decode()) for i in range(0,8) if d[i*3000:(i+1)*3000]]'
      - name: One-time APK chunk batch 02
        working-directory: lumen-tv
        run: python3 -c 'import base64; d=open("Lumen-TV-debug.apk","rb").read(); [print("::notice title=Lumen APK chunk::%04d:" % i + base64.b64encode(d[i*3000:(i+1)*3000]).decode()) for i in range(8,16) if d[i*3000:(i+1)*3000]]'
