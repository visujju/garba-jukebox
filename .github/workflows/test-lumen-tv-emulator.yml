name: Test Lumen TV on Android TV

on:
  push:
    paths:
      - 'lumen-tv/**'
      - '.github/workflows/test-lumen-tv-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build Lumen TV for the emulator
        working-directory: lumen-tv
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the TV remote and offline UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-boot-timeout: 600
          script: bash lumen-tv/tests/device-smoke.sh
