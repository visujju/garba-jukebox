name: Build TV Browser APK

on:
  push:
    paths:
      - 'tv-browser/**'
      - '.github/workflows/build-tv-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check Android TV manifest
        run: python3 -m unittest discover -s tv-browser/tests -v
      - name: Test focus support for website cards
        working-directory: tv-browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:focus
      - name: Test and build debug APK
        working-directory: tv-browser
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk TV-Browser-debug.apk
      # One-time transfer of this public debug APK to the session's workspace.
      # GitHub truncates individual annotations, so use small chunks across steps.
      - name: Export APK chunks 0-7
        env:
          FIRST_CHUNK: '0'
        run: |
          python3 -c 'import base64,hashlib,os,pathlib; b=pathlib.Path("tv-browser/TV-Browser-debug.apk").read_bytes(); p=[b[i:i+3000] for i in range(0,len(b),3000)]; n=int(os.environ["FIRST_CHUNK"]); assert len(p)<=48; print("::notice title=TVAPK-SHA256::"+hashlib.sha256(b).hexdigest()) if n==0 else None; [print("::notice title=TVAPK-%03d::%s"%(i,base64.b64encode(p[i]).decode())) for i in range(n,min(n+8,len(p)))]'
      - name: Export APK chunks 8-15
        env:
          FIRST_CHUNK: '8'
        run: |
          python3 -c 'import base64,hashlib,os,pathlib; b=pathlib.Path("tv-browser/TV-Browser-debug.apk").read_bytes(); p=[b[i:i+3000] for i in range(0,len(b),3000)]; n=int(os.environ["FIRST_CHUNK"]); assert len(p)<=48; print("::notice title=TVAPK-SHA256::"+hashlib.sha256(b).hexdigest()) if n==0 else None; [print("::notice title=TVAPK-%03d::%s"%(i,base64.b64encode(p[i]).decode())) for i in range(n,min(n+8,len(p)))]'
      - name: Export APK chunks 16-23
        env:
          FIRST_CHUNK: '16'
        run: |
          python3 -c 'import base64,hashlib,os,pathlib; b=pathlib.Path("tv-browser/TV-Browser-debug.apk").read_bytes(); p=[b[i:i+3000] for i in range(0,len(b),3000)]; n=int(os.environ["FIRST_CHUNK"]); assert len(p)<=48; print("::notice title=TVAPK-SHA256::"+hashlib.sha256(b).hexdigest()) if n==0 else None; [print("::notice title=TVAPK-%03d::%s"%(i,base64.b64encode(p[i]).decode())) for i in range(n,min(n+8,len(p)))]'
      - name: Export APK chunks 24-31
        env:
          FIRST_CHUNK: '24'
        run: |
          python3 -c 'import base64,hashlib,os,pathlib; b=pathlib.Path("tv-browser/TV-Browser-debug.apk").read_bytes(); p=[b[i:i+3000] for i in range(0,len(b),3000)]; n=int(os.environ["FIRST_CHUNK"]); assert len(p)<=48; print("::notice title=TVAPK-SHA256::"+hashlib.sha256(b).hexdigest()) if n==0 else None; [print("::notice title=TVAPK-%03d::%s"%(i,base64.b64encode(p[i]).decode())) for i in range(n,min(n+8,len(p)))]'
      - name: Export APK chunks 32-39
        env:
          FIRST_CHUNK: '32'
        run: |
          python3 -c 'import base64,hashlib,os,pathlib; b=pathlib.Path("tv-browser/TV-Browser-debug.apk").read_bytes(); p=[b[i:i+3000] for i in range(0,len(b),3000)]; n=int(os.environ["FIRST_CHUNK"]); assert len(p)<=48; print("::notice title=TVAPK-SHA256::"+hashlib.sha256(b).hexdigest()) if n==0 else None; [print("::notice title=TVAPK-%03d::%s"%(i,base64.b64encode(p[i]).decode())) for i in range(n,min(n+8,len(p)))]'
      - name: Export APK chunks 40-47
        env:
          FIRST_CHUNK: '40'
        run: |
          python3 -c 'import base64,hashlib,os,pathlib; b=pathlib.Path("tv-browser/TV-Browser-debug.apk").read_bytes(); p=[b[i:i+3000] for i in range(0,len(b),3000)]; n=int(os.environ["FIRST_CHUNK"]); assert len(p)<=48; print("::notice title=TVAPK-SHA256::"+hashlib.sha256(b).hexdigest()) if n==0 else None; [print("::notice title=TVAPK-%03d::%s"%(i,base64.b64encode(p[i]).decode())) for i in range(n,min(n+8,len(p)))]'
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Browser-APK
          path: tv-browser/TV-Browser-debug.apk
          if-no-files-found: error
          retention-days: 30
