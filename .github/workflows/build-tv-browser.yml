name: Build TV Browser APK

on:
  push:
    paths:
      - 'tv-browser/**'
      - '.github/workflows/build-tv-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check Android TV manifest
        run: python3 -m unittest discover -s tv-browser/tests -v
      - name: Test and build debug APK
        working-directory: tv-browser
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk TV-Browser-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Browser-APK
          path: tv-browser/TV-Browser-debug.apk
          if-no-files-found: error
          retention-days: 30
